// Real consumption proof for the com.ishtaran:ishtaran-java artifact via Gradle (mavenLocal()) —
// the mandatory second half of the "package dry run" in the SDK Program brief (the brief requires
// both a Maven consumer and a Gradle consumer, since the Maven artifact serves both).
plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'com.ishtaran:ishtaran-java:1.0.0-SNAPSHOT'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.ishtaran.samples.GradleConsumerSmokeTest'
}
